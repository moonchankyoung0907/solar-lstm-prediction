# 군산 태양광 발전소 - 데이터 수집기 설정
# COM 포트 및 통신 파라미터 설정 파일
# 장비 추가/교체 시 이 파일만 수정하면 됩니다.

[bms]
# BMS: RS485 Modbus RTU (CRC16)
port         = COM3
baudrate     = 9600
bytesize     = 8
parity       = N
stopbits     = 1
timeout      = 1.0
# Modbus 슬레이브 주소 (0x01~0xF7)
slave_id     = 1
# 읽을 홀딩 레지스터 시작 주소 및 개수
reg_start    = 0x0000
reg_count    = 10

[weather]
# 기상센서: UART 17byte 고정 패킷, XOR 체크섬
port         = COM4
baudrate     = 9600
bytesize     = 8
parity       = N
stopbits     = 1
timeout      = 2.0
# 패킷 헤더 바이트 (0xAA 0x55)
header_b0    = 0xAA
header_b1    = 0x55
packet_len   = 17

[meter]
# 전력량계: 4800bps, 8byte 고정 패킷
port         = COM5
baudrate     = 4800
bytesize     = 8
parity       = N
stopbits     = 1
timeout      = 2.0
# 패킷 시작/종료 바이트
start_byte   = 0x68
end_byte     = 0x16
packet_len   = 8

[collector]
# 수집 주기 (초)
interval_sec = 60
# 저장 대상 xlsx 파일 경로 (상대 경로 또는 절대 경로)
xlsx_path    = ../log.xlsx
# 로그 레벨: DEBUG / INFO / WARNING / ERROR
log_level    = INFO
